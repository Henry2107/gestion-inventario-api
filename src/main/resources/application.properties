# Configuración de la Base de Datos H2
spring.datasource.url=jdbc:h2:mem:inventariodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar la consola web de H2 para ver las tablas visualmente
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Muestra las consultas SQL reales en la consola de la IDE para poder auditar qué hace la IA o Spring
spring.jpa.show-sql=true
# Crea automáticamente las tablas basadas en nuestras clases de Java
spring.jpa.hibernate.ddl-auto=update
spring.application.name=gention-inventario 
